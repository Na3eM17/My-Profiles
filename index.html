<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>na3em.profiles</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <div class="container">
      <div class="profile-card">
        <div class="profile-img" onclick="openImage()">
          <img src="photo.jpg" alt="Profile" />
        </div>

        <div class="modal" id="modal" onclick="closeImage()">
          <div class="modal-content">
            <img src="photo.jpg" alt="Expanded View" />
          </div>
        </div>

        <h2 class="name">Na3em Alhindi</h2>
        <p class="phone">0799788976</p>

        <div class="links">
          <a class="link" href="https://github.com/na3em17" target="_blank"
            >GitHub</a
          >
          <a class="link" href="https://instagram.com/neemo_bh" target="_blank"
            >Instagram</a
          >
          <a
            class="link"
            href="https://facebook.com/profile.php?id=100005426567781"
            target="_blank"
            >Facebook</a
          >
          <a
            class="link"
            href="https://linkedin.com/in/naeem-alhindi-720b29310"
            target="_blank"
            >LinkedIn</a
          >
        </div>
      </div>
    </div>

    <script>
      function openImage() {
        document.getElementById("modal").style.display = "flex";
      }
      function closeImage() {
        document.getElementById("modal").style.display = "none";
      }
    </script>
  </body>
</html>
